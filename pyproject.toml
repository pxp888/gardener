[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gardener-proxy"
version = "0.1.0"
description = "Turn-based context compaction proxy for LLMs and coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.8.0",
]

[project.scripts]
gardener = "gardener.cli:main"
gardener-proxy = "gardener.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gardener*"]
